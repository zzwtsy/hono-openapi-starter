name: E2E

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 10 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(github.event_name == 'schedule' && '["chromium", "firefox", "webkit"]' || '["chromium"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck E2E
        run: pnpm --filter e2e typecheck
      - name: Test E2E runner lifecycle
        run: pnpm --filter e2e test:runner
      - name: Install Playwright browser
        run: pnpm --filter e2e exec playwright install --with-deps ${{ matrix.browser }}
      - name: Run Playwright E2E
        env:
          CI: true
        run: pnpm --filter e2e test -- --project=${{ matrix.browser }}
      - name: Upload Playwright artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-${{ matrix.browser }}-${{ github.run_attempt }}
          path: |
            apps/e2e/playwright-report/
            apps/e2e/test-results/
            apps/e2e/service-logs/
          if-no-files-found: ignore
          retention-days: 14
