catalogMode: strict

# 显式配置会启用严格模式：依赖发布未满 24 小时时直接拒绝解析。
minimumReleaseAge: 1440
shellEmulator: true

trustPolicy: no-downgrade
# Babel 依赖的 semver@6.3.1 会触发历史信任降级；精确放行，避免跨 major 全局 override。
trustPolicyExclude:
  - semver@6.3.1

packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  cpu-features: false
  esbuild: true
  msw: false
  protobufjs: false
  ssh2: false
  unrs-resolver: false

